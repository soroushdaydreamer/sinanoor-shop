<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سبد خرید | سینا نور</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .cart-page{max-width:520px;margin:0 auto;padding:18px 14px 100px}
  .cart-page h1{font-size:17px;margin:8px 0 16px}
  .cart-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fff}
  .cart-item .ph{width:56px;height:56px;border-radius:8px;flex-shrink:0}
  .cart-item img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex-shrink:0}
  .cart-item .info{flex:1;min-width:0}
  .cart-item .title{font-size:12.5px;line-height:1.5;margin-bottom:6px}
  .cart-item .price{font-size:12px;color:var(--text-2)}
  .qty-box{display:flex;align-items:center;gap:8px}
  .qty-box button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer}
  .qty-box span{min-width:18px;text-align:center;font-size:13px}
  .remove-btn{color:#e53935;font-size:11px;background:none;border:none;cursor:pointer;padding:0;margin-top:6px}
  .cart-summary{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;margin-top:16px}
  .cart-summary .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
  .cart-summary .row.total{font-weight:700;font-size:15px;border-top:1px dashed var(--line);padding-top:8px}
  .empty-cart{text-align:center;color:var(--text-2);padding:60px 20px;font-size:13px}
  textarea.field{resize:vertical;min-height:70px}
  .form-error{color:#e53935;font-size:13px;min-height:16px}
  .order-success{text-align:center;padding:40px 20px}
  .order-success .check{font-size:44px;margin-bottom:10px}
</style>
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <a href="index.html" class="icon-btn" aria-label="بازگشت">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg>
      </a>
      <div class="brand-logo">سبد خرید</div>
      <span style="width:22px"></span>
    </div>
  </header>

  <main class="cart-page" id="cartRoot"></main>

  <script>window.SINA_NOOR_API_BASE = "https://api.sinanoor.cyou";</script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script>
    const root = document.getElementById('cartRoot');
    const fmt = n => Number(n).toLocaleString('fa-IR');
    const PH_CLASSES = ['ph-1','ph-2','ph-3','ph-4','ph-5'];

    function renderCartPage() {
      const items = cart.get();
      if (!items.length) {
        root.innerHTML = `<div class="empty-cart">سبد خرید شما خالی است.<br><br><a href="index.html" class="btn btn-primary" style="display:inline-block;margin-top:10px">بازگشت به فروشگاه</a></div>`;
        return;
      }

      const total = cart.total(items);
      root.innerHTML = `
        <h1>سبد خرید (${cart.count(items)} کالا)</h1>
        <div id="itemsList">
          ${items.map((it, i) => `
            <div class="cart-item" data-pid="${it.product_id}">
              ${it.image_url ? `<img src="${it.image_url}" alt="${it.title}">` : `<span class="ph ${it.ph || PH_CLASSES[i % PH_CLASSES.length]}"></span>`}
              <div class="info">
                <div class="title">${it.title}</div>
                <div class="price">${fmt(it.price)} تومان</div>
                <div class="qty-box">
                  <button data-dec="${it.product_id}">−</button>
                  <span>${it.qty}</span>
                  <button data-inc="${it.product_id}">+</button>
                </div>
                <button class="remove-btn" data-remove="${it.product_id}">حذف از سبد</button>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="cart-summary">
          <div class="row"><span>جمع کالاها</span><span>${fmt(total)} تومان</span></div>
          <div class="row total"><span>مبلغ قابل پرداخت</span><span>${fmt(total)} تومان</span></div>
        </div>

        <div class="cart-summary">
          <p class="form-error" id="checkoutError"></p>
          <form id="checkoutForm">
            <input class="field" name="phone" placeholder="شماره موبایل تحویل‌گیرنده" maxlength="11" required>
            <textarea class="field" name="address" placeholder="آدرس کامل ارسال" required></textarea>
            <button type="submit" class="btn btn-primary btn-block" id="submitOrderBtn">ثبت نهایی سفارش</button>
          </form>
        </div>
      `;

      document.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
        const it = items.find(x => x.product_id == b.dataset.inc);
        cart.setQty(it.product_id, it.qty + 1);
        renderCartPage();
      }));
      document.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
        const it = items.find(x => x.product_id == b.dataset.dec);
        cart.setQty(it.product_id, it.qty - 1);
        renderCartPage();
      }));
      document.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
        cart.remove(Number(b.dataset.remove));
        renderCartPage();
      }));

      // پیش‌پر کردن شماره موبایل کاربر لاگین‌شده
      const user = api.getUser && api.getUser();
      if (user?.phone) document.querySelector('#checkoutForm [name="phone"]').value = user.phone;

      document.getElementById('checkoutForm').addEventListener('submit', onCheckout);
    }

    async function onCheckout(e) {
      e.preventDefault();
      const errEl = document.getElementById('checkoutError');
      errEl.textContent = '';

      if (!api.isLoggedIn()) {
        errEl.textContent = 'برای ثبت سفارش ابتدا وارد حساب کاربری خود شوید.';
        setTimeout(() => { window.location.href = 'login.html'; }, 1200);
        return;
      }

      const fd = new FormData(e.target);
      const items = cart.get();
      const btn = document.getElementById('submitOrderBtn');
      btn.disabled = true; btn.textContent = 'در حال ثبت سفارش...';

      try {
        const payload = {
          items: items.map(i => ({ product_id: i.product_id, qty: i.qty })),
          address: fd.get('address').trim(),
          phone: fd.get('phone').trim(),
        };
        const res = await api.createOrder(payload);
        cart.clear();
        root.innerHTML = `
          <div class="order-success">
            <div class="check">✅</div>
            <h1>سفارش شما با موفقیت ثبت شد</h1>
            <p style="color:var(--text-2);font-size:13px">شماره سفارش: #${res.order_id}</p>
            <a href="account.html" class="btn btn-primary" style="display:inline-block;margin-top:16px">پیگیری سفارش</a>
          </div>
        `;
      } catch (err) {
        errEl.textContent = err.message;
        btn.disabled = false; btn.textContent = 'ثبت نهایی سفارش';
      }
    }

    renderCartPage();
  </script>
</body>
</html>
